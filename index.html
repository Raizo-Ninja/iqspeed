<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سرعتي — Sur3ati</title>
<meta name="description" content="Real internet speed test for Iraq with an automatic diagnostic report">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070b16;--bg2:#0d1425;--surface:rgba(17,26,46,.72);--inset:rgba(0,0,0,.22);
  --line:rgba(120,150,210,.14);--line2:rgba(120,150,210,.3);
  --text:#e8eefb;--muted:#8a99ba;--accent:#3ee0ff;--accent2:#7c6cff;--accentText:#3ee0ff;--onAccent:#06101f;
  --glow:rgba(62,224,255,.45);--track:rgba(120,150,210,.12);--tick:rgba(120,150,210,.25);--particle:180,220,255;--particleLine:62,224,255;
  --good:#2fd47a;--warn:#ffb03b;--bad:#ff5d6c;
  --aurora1:rgba(62,224,255,.14);--aurora2:rgba(124,108,255,.16);--aurora3:rgba(62,224,255,.07);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans Arabic","Vazirmatn","IBM Plex Sans","Segoe UI",Tahoma,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef2fa;--bg2:#ffffff;--surface:rgba(255,255,255,.78);--inset:rgba(20,40,80,.05);
  --line:rgba(30,50,90,.12);--line2:rgba(30,50,90,.24);
  --text:#0f1a30;--muted:#5c6b8c;--accent:#0aa3c9;--accent2:#6d5dfc;--accentText:#087a97;--onAccent:#ffffff;
  --glow:rgba(10,163,201,.35);--track:rgba(30,50,90,.1);--tick:rgba(30,50,90,.22);--particle:40,90,160;--particleLine:10,163,201;
  --good:#16a34a;--warn:#d97706;--bad:#dc2626;
  --aurora1:rgba(10,163,201,.16);--aurora2:rgba(109,93,252,.14);--aurora3:rgba(10,163,201,.08);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#eef2fa;--bg2:#ffffff;--surface:rgba(255,255,255,.78);--inset:rgba(20,40,80,.05);
    --line:rgba(30,50,90,.12);--line2:rgba(30,50,90,.24);
    --text:#0f1a30;--muted:#5c6b8c;--accent:#0aa3c9;--accent2:#6d5dfc;--accentText:#087a97;--onAccent:#ffffff;
    --glow:rgba(10,163,201,.35);--track:rgba(30,50,90,.1);--tick:rgba(30,50,90,.22);--particle:40,90,160;--particleLine:10,163,201;
    --good:#16a34a;--warn:#d97706;--bad:#dc2626;
    --aurora1:rgba(10,163,201,.16);--aurora2:rgba(109,93,252,.14);--aurora3:rgba(10,163,201,.08);
  }
}
html[lang="ku"]{--sans:"Vazirmatn","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
html[lang="en"]{--sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:
  radial-gradient(40% 35% at 30% 20%,var(--aurora1),transparent 70%),
  radial-gradient(35% 35% at 75% 15%,var(--aurora2),transparent 70%),
  radial-gradient(45% 40% at 60% 90%,var(--aurora3),transparent 70%);
  filter:blur(40px);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-block:22px 70px;padding-inline:16px}
svg.ic{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* splash */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.splashIn{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(92vw,520px)}
#splashMap{width:100%;aspect-ratio:400/340}
#splashMap svg{width:100%;height:100%;display:block;overflow:visible}
.sIraq{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:url(#sg);stroke-width:2;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.3s var(--ease) forwards .1s,fillIn .8s ease forwards 1.1s;fill-opacity:0;filter:drop-shadow(0 0 14px var(--glow))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:1}}
.sRing{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:sRing 1.6s ease-out forwards}
.sRing.r1{animation-delay:1.25s}.sRing.r2{animation-delay:1.55s}.sRing.r3{animation-delay:1.85s}
@keyframes sRing{0%{transform:scale(.2);opacity:.9}100%{transform:scale(6);opacity:0}}
.sDot{fill:#fff;opacity:0;animation:popIn .4s var(--ease) forwards 1.2s;filter:drop-shadow(0 0 6px var(--accent))}
@keyframes popIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.sArc{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;opacity:.9;animation:draw 1s var(--ease) forwards}
.sPkt{fill:#fff;opacity:0;filter:drop-shadow(0 0 5px var(--accent))}
.sNode{fill:var(--bg2);stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:popIn .45s var(--ease) forwards}
.sHalo{fill:none;stroke:var(--accent);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:sRing 1.4s ease-out forwards}
.splashIn h2{margin:0;font-size:30px;font-weight:700;opacity:0;animation:rise .6s var(--ease) forwards 2.2s}
.splashIn p{margin:0;color:var(--muted);font-size:13px;letter-spacing:.14em;opacity:0;animation:rise .6s var(--ease) forwards 2.35s}
.splashSkip{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;opacity:0;animation:rise .6s ease forwards 2.6s;cursor:pointer}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px;animation:fadeDown .7s var(--ease) both}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;position:relative;display:grid;place-items:center;color:var(--onAccent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 30px -8px var(--glow)}
.logo svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.logo::after{content:"";position:absolute;inset:-3px;border-radius:16px;border:1px solid var(--accent);opacity:.35;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.8;transform:scale(1.06)}}
.brand h1{font-size:21px;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);backdrop-filter:blur(8px)}
.chip b{color:var(--text);font-weight:500;font-family:var(--mono);font-size:12.5px;direction:ltr}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.chip.on i{background:var(--good);box-shadow:0 0 8px var(--good)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.seg button{background:transparent;color:var(--muted);box-shadow:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;transform:none}
.seg button.on{background:var(--accent);color:var(--onAccent)}
.iconBtn{width:38px;height:38px;padding:0;border-radius:999px;background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none;display:grid;place-items:center;backdrop-filter:blur(8px)}
.iconBtn svg{width:18px;height:18px;transition:transform .5s var(--ease)}
.iconBtn:hover svg{transform:rotate(25deg)}
.iconBtn .sun,.iconBtn .moon{position:absolute;transition:opacity .3s,transform .5s var(--ease)}
:root[data-theme="light"] .iconBtn .moon,:root:not([data-theme="dark"]) .iconBtn .moon{opacity:1;transform:none}
:root[data-theme="light"] .iconBtn .sun,:root:not([data-theme="dark"]) .iconBtn .sun{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme="dark"] .iconBtn .moon{opacity:0;transform:rotate(90deg) scale(.4)}
:root[data-theme="dark"] .iconBtn .sun{opacity:1;transform:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .iconBtn .moon{opacity:0;transform:rotate(90deg) scale(.4)}:root:not([data-theme="light"]) .iconBtn .sun{opacity:1;transform:none}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;backdrop-filter:blur(14px);position:relative;overflow:hidden;box-shadow:0 20px 60px -30px rgba(0,0,0,.45);transition:background .4s,border-color .4s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.stage{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
@media(max-width:800px){.stage{grid-template-columns:1fr}}
.rise{animation:rise .8s var(--ease) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* gauge */
.gaugeBox{display:flex;flex-direction:column;align-items:center;gap:6px}
.gaugeWrap{position:relative;width:100%;max-width:400px;aspect-ratio:1/0.92}
canvas#gauge{position:absolute;inset:0;width:100%;height:100%}
.pulse{position:absolute;left:50%;top:52%;width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.pulse.go{animation:pulseOut 1.2s var(--ease) forwards}
@keyframes pulseOut{0%{transform:translate(-50%,-50%) scale(0);opacity:.9}100%{transform:translate(-50%,-50%) scale(22);opacity:0}}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6%;pointer-events:none}
.readout .big{font-family:var(--mono);font-size:clamp(46px,11vw,66px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 0 30px var(--glow);direction:ltr}
.readout .unit{color:var(--muted);font-size:14px;margin-top:6px;letter-spacing:.08em}
.readout .kind{font-size:12.5px;color:var(--accentText);margin-top:2px;min-height:18px;display:flex;align-items:center;gap:5px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:400px;margin-top:-6px}
.sum{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;transition:border-color .3s,box-shadow .3s}
.sum.live{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.sum .sl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px}
.sum .sl svg{color:var(--accentText)}
.sum .sv{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;direction:ltr;display:flex;align-items:baseline;justify-content:center;gap:4px}
.sum .sv small{font-size:10.5px;color:var(--muted);font-family:var(--sans);font-weight:400}
.sum.good .sv span{color:var(--good)}.sum.warn .sv span{color:var(--warn)}.sum.bad .sv span{color:var(--bad)}
.steps{display:flex;gap:6px;width:100%;max-width:400px;margin-top:2px}
.step{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);text-align:center;transition:color .3s}
.step .bar{height:4px;border-radius:4px;background:var(--track);overflow:hidden;position:relative}
.step .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transform:scaleX(0);transform-origin:inline-start;transition:transform .3s linear}
[dir="rtl"] .step .bar::after{transform-origin:right}[dir="ltr"] .step .bar::after{transform-origin:left}
.step.done .bar::after{transform:scaleX(1)}
.step.active{color:var(--text)}
.step.active .bar::after{transform:scaleX(var(--p,0))}
.phase{color:var(--muted);font-size:14px;min-height:22px;text-align:center;transition:opacity .3s}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:12px}
button{font-family:inherit;font-size:15px;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;color:var(--onAccent);background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700;position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .2s,filter .15s,background .3s,color .3s;box-shadow:0 10px 30px -10px var(--glow);display:inline-flex;align-items:center;gap:8px}
button:hover{transform:translateY(-1px);box-shadow:0 14px 34px -10px var(--glow)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}
button.ghost:hover{background:var(--inset)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field input{width:88px;background:var(--inset);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:14px;transition:border-color .2s,box-shadow .2s;direction:ltr}
.field input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}

/* map */
#mapWrap{position:absolute;inset:0}
#mapWrap svg{width:100%;height:100%;display:block}
.iraq{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-width:1.4;stroke-linejoin:round;filter:drop-shadow(0 0 10px var(--glow))}
.iraqGlow{fill:none;stroke:var(--accent);stroke-width:6;opacity:.12}
.city{fill:var(--text)}.cityLbl{fill:var(--muted);font-size:8.5px;font-family:var(--sans)}
.src{fill:#fff;stroke:var(--accent);stroke-width:2}
.srcRing{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.8;transform-box:fill-box;transform-origin:center;animation:srcRing 2.2s ease-out infinite}
@keyframes srcRing{from{transform:scale(.3);opacity:.9}to{transform:scale(3);opacity:0}}
.arc{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 7;opacity:.55;transition:stroke .4s,opacity .4s}
.arc.live{stroke:var(--accent);opacity:1;animation:flow .7s linear infinite}
.arc.good{stroke:var(--good);opacity:.95}.arc.mid{stroke:#5aa9ff;opacity:.95}.arc.warn{stroke:var(--warn);opacity:.95}.arc.bad{stroke:var(--bad);opacity:.95}
.arc.done{stroke-dasharray:none;stroke-width:2}
@keyframes flow{to{stroke-dashoffset:-12}}
.pkt{fill:#fff;filter:drop-shadow(0 0 4px var(--accent))}
.node{fill:var(--bg2);stroke:var(--line2);stroke-width:1.5;transition:stroke .4s,fill .4s}
.node.live{stroke:var(--accent)}.node.good{stroke:var(--good)}.node.mid{stroke:#5aa9ff}.node.warn{stroke:var(--warn)}.node.bad{stroke:var(--bad)}
.nodeLbl{fill:var(--text);font-size:9px;font-weight:600;font-family:var(--sans)}
.nodeMs{fill:var(--muted);font-size:9px;font-family:var(--mono);font-weight:600}
.nodeMs.good{fill:var(--good)}.nodeMs.mid{fill:#5aa9ff}.nodeMs.warn{fill:var(--warn)}.nodeMs.bad{fill:var(--bad)}
.arrow{fill:var(--line2);transition:fill .4s}.arrow.good{fill:var(--good)}.arrow.mid{fill:#5aa9ff}.arrow.warn{fill:var(--warn)}.arrow.bad{fill:var(--bad)}.arrow.live{fill:var(--accent)}
.grid{stroke:var(--line);stroke-width:.6}
/* modes / server */
.modes{display:flex;gap:4px;background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:6px}
.modes button{background:transparent;color:var(--muted);box-shadow:none;padding:8px 16px;border-radius:999px;font-size:13.5px;transform:none}
.modes button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onAccent)}
.modes button:hover{transform:none}
select{font-family:inherit;font-size:13.5px;background:var(--inset);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:8px 10px;transition:border-color .2s,box-shadow .2s}
select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
#customUrl{width:min(100%,360px);background:var(--inset);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:13px;direction:ltr}
#customUrl:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
#serverRow{margin-top:4px}
.gameTbl td,.gameTbl th{padding:9px 8px;white-space:nowrap}
.gameTbl .rg{font-weight:600}.gameTbl .rg small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;white-space:normal;max-width:220px}
.gameTbl tr.live td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.badge.good{background:var(--good)}.badge.mid{background:#5aa9ff}.badge.warn{background:var(--warn)}.badge.bad{background:var(--bad)}.badge.wait{background:var(--line2);color:var(--muted)}
.n.good{color:var(--good)}.n.warn{color:var(--warn)}.n.bad{color:var(--bad)}
/* stats */
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;font-size:16px;font-weight:600}
.section-title .tag{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--mono)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--inset);border:1px solid var(--line);border-radius:14px;padding:12px 14px;padding-inline-start:18px;position:relative;overflow:hidden;transition:transform .3s var(--ease),border-color .3s}
.stat:hover{transform:translateY(-2px);border-color:var(--line2)}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .lbl svg{color:var(--accentText)}
.stat .val{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;display:flex;align-items:baseline;gap:6px;direction:ltr;justify-content:flex-end}
[dir="ltr"] .stat .val{justify-content:flex-start}
.stat .val small{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:400}
.stat::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line2);transition:background .4s,box-shadow .4s}
.stat.good::before{background:var(--good);box-shadow:0 0 12px var(--good)}
.stat.warn::before{background:var(--warn);box-shadow:0 0 12px var(--warn)}
.stat.bad::before{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.stat.live::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);animation:shine 1.4s linear infinite}
@keyframes shine{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.spark{width:100%;height:46px;display:block;margin-top:6px}
.hint{color:var(--muted);font-size:12.5px;margin-top:12px}

/* report */
#report{margin-top:20px}
.verdict{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:16px;background:var(--inset);border:1px solid var(--line);margin-bottom:14px;animation:rise .6s var(--ease) both}
.grade{font-family:var(--mono);font-size:36px;font-weight:600;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:#06101f;flex:none;animation:pop .6s var(--ease) both .1s}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.g-A{background:var(--good);box-shadow:0 0 30px -6px var(--good)}.g-B{background:#8ff0b6}.g-C{background:var(--warn);box-shadow:0 0 30px -6px var(--warn)}.g-D{background:#ff8d4d}.g-F{background:var(--bad);box-shadow:0 0 30px -6px var(--bad);color:#fff}
.verdict h3{margin:0;font-size:17px}.verdict p{margin:2px 0 0;color:var(--muted);font-size:13px}
.scoreBar{height:6px;border-radius:6px;background:var(--track);margin-top:8px;overflow:hidden;width:220px;max-width:100%}
.scoreBar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));width:0;transition:width 1.2s var(--ease)}
.issues{display:grid;gap:10px}
.issue{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 15px;border-radius:14px;background:var(--inset);border:1px solid var(--line);opacity:0;transform:translateY(12px);animation:rise .55s var(--ease) forwards}
.issue .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin-top:2px;color:#fff}
.issue .dot svg{width:15px;height:15px}
.issue.bad .dot{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 18%,transparent)}
.issue.warn .dot{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 18%,transparent)}
.issue.ok .dot{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 18%,transparent)}
.issue h4{margin:0 0 2px;font-size:15px}.issue p{margin:0;color:var(--muted);font-size:13.5px}
.issue .fix{margin-top:7px;font-size:13.5px;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 35%,transparent)}
.issue .fix b{color:var(--accentText);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
tbody tr:hover{background:var(--inset)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr}
.tableWrap{overflow-x:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--bg2);border:1px solid var(--line2);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s var(--ease);pointer-events:none;z-index:9;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin-top:32px;color:var(--muted);font-size:12.5px;text-align:center}
@media print{body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff;box-shadow:none}.controls,.actions,#historyCard,footer,#bgc,.aurora,.tools,#splash{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.issue{opacity:1;transform:none}#splash{display:none}}
</style>
</head>

<div id="splash"><div class="splashIn">
  <div id="splashMap"></div>
  <h2 data-i18n="title">سرعتي</h2><p data-i18n="tagline">IRAQ SPEED TEST</p>
</div></div>

<canvas id="bgc"></canvas><div class="aurora"></div>
<div class="wrap">
<header>
  <div class="brand">
    <div class="logo"><svg><use href="#i-bolt"/></svg></div>
    <div><h1 data-i18n="title">سرعتي</h1><small data-i18n="subtitle"></small></div>
  </div>
  <div class="tools">
    <div class="meta">
      <div class="chip" id="cIp"><i></i>IP <b id="mIp">—</b></div>
      <div class="chip" id="cIsp"><i></i><span data-i18n="isp"></span> <b id="mIsp">—</b></div>
      <div class="chip" id="cColo"><i></i><span data-i18n="server"></span> <b id="mColo">—</b></div>
    </div>
    <div class="seg" id="langSeg"><button data-lang="ar">عربي</button><button data-lang="ku">کوردی</button><button data-lang="en">EN</button></div>
    <button class="iconBtn" id="themeBtn" aria-label="theme"><svg class="ic sun"><use href="#i-sun"/></svg><svg class="ic moon"><use href="#i-moon"/></svg></button>
  </div>
</header>

<div class="stage">
  <div class="card gaugeBox rise d1">
    <div class="modes" id="modes">
      <button data-mode="speed" class="on"><svg class="ic"><use href="#i-down"/></svg><span data-i18n="modeSpeed"></span></button>
      <button data-mode="game"><svg class="ic"><use href="#i-game"/></svg><span data-i18n="modeGame"></span></button>
    </div>
    <div class="gaugeWrap">
      <canvas id="gauge" width="800" height="740"></canvas>
      <div class="pulse" id="pulse"></div>
      <div id="mapWrap" hidden></div>
      <div class="readout"><div class="big" id="bigVal">0.0</div><div class="unit" id="unit">Mbps</div><div class="kind" id="kind"></div></div>
    </div>
    <div class="summary">
      <div class="sum" id="sumDown"><div class="sl"><svg class="ic"><use href="#i-down"/></svg><span data-i18n="download"></span></div><div class="sv"><span>—</span><small>Mbps</small></div></div>
      <div class="sum" id="sumUp"><div class="sl"><svg class="ic"><use href="#i-up"/></svg><span data-i18n="upload"></span></div><div class="sv"><span>—</span><small>Mbps</small></div></div>
      <div class="sum" id="sumPing"><div class="sl"><svg class="ic"><use href="#i-ping"/></svg>Ping</div><div class="sv"><span>—</span><small>ms</small></div></div>
    </div>
    <div class="steps">
      <div class="step" id="st1"><div class="bar"></div>Ping</div>
      <div class="step" id="st2"><div class="bar"></div><span data-i18n="download"></span></div>
      <div class="step" id="st3"><div class="bar"></div><span data-i18n="upload"></span></div>
      <div class="step" id="st4"><div class="bar"></div><span data-i18n="report"></span></div>
    </div>
    <div class="phase" id="phase"></div>
    <div class="controls">
      <button id="startBtn"><svg class="ic"><use href="#i-play"/></svg><span data-i18n="start"></span></button>
      <button id="stopBtn" class="ghost" disabled><svg class="ic"><use href="#i-stop"/></svg><span data-i18n="stop"></span></button>
      <label class="field" id="planField"><span data-i18n="plan"></span> <input id="planSpeed" type="number" min="1" placeholder="50"> Mbps</label>
    </div>
    <div class="controls" id="serverRow">
      <label class="field"><svg class="ic"><use href="#i-server"/></svg><span data-i18n="serverLbl"></span>
        <select id="serverSel"></select>
      </label>
      <input id="customUrl" type="url" placeholder="https://speed.example.com/backend/" hidden>
    </div>
  </div>

  <div class="card rise d2">
    <h2 class="section-title"><span data-i18n="results"></span> <span class="tag" id="testTime">—</span></h2>
    <div class="stats">
      <div class="stat" id="sDown"><div class="lbl"><svg class="ic"><use href="#i-down"/></svg><span data-i18n="download"></span></div><div class="val"><span>—</span> <small>Mbps</small></div><canvas class="spark" id="spDown"></canvas></div>
      <div class="stat" id="sUp"><div class="lbl"><svg class="ic"><use href="#i-up"/></svg><span data-i18n="upload"></span></div><div class="val"><span>—</span> <small>Mbps</small></div><canvas class="spark" id="spUp"></canvas></div>
      <div class="stat" id="sPing"><div class="lbl"><svg class="ic"><use href="#i-ping"/></svg><span data-i18n="ping"></span></div><div class="val"><span>—</span> <small>ms</small></div></div>
      <div class="stat" id="sJit"><div class="lbl"><svg class="ic"><use href="#i-jit"/></svg><span data-i18n="jitter"></span></div><div class="val"><span>—</span> <small>ms</small></div></div>
      <div class="stat" id="sLoss"><div class="lbl"><svg class="ic"><use href="#i-loss"/></svg><span data-i18n="failed"></span></div><div class="val"><span>—</span> <small><span data-i18n="of"></span> <span id="lossTotal">—</span></small></div></div>
      <div class="stat" id="sStab"><div class="lbl"><svg class="ic"><use href="#i-stab"/></svg><span data-i18n="stability"></span></div><div class="val"><span>—</span> <small>%</small></div></div>
      <div class="stat" id="sLoaded"><div class="lbl"><svg class="ic"><use href="#i-ping"/></svg><span data-i18n="loadedPing"></span></div><div class="val"><span>—</span> <small>ms</small></div></div>
      <div class="stat" id="sPeak"><div class="lbl"><svg class="ic"><use href="#i-bolt"/></svg><span data-i18n="peak"></span></div><div class="val"><span>—</span> <small>Mbps</small></div></div>
    </div>
    <p class="hint" id="speedHint" data-i18n="hint"></p>
    <div id="gamePanel" hidden>
      <div class="tableWrap"><table class="gameTbl"><thead><tr><th data-i18n="gRegion"></th><th>Ping</th><th>Jitter</th><th data-i18n="gLoss"></th><th data-i18n="gRating"></th></tr></thead><tbody id="gameBody"></tbody></table></div>
      <p class="hint" data-i18n="gHint"></p>
    </div>
  </div>
</div>

<div class="card" id="report" hidden>

  <div class="actions">
    <button id="copyBtn" class="ghost"><svg class="ic"><use href="#i-copy"/></svg><span data-i18n="copy"></span></button>
    <button id="printBtn" class="ghost"><svg class="ic"><use href="#i-print"/></svg><span data-i18n="print"></span></button>
    <button id="againBtn"><svg class="ic"><use href="#i-redo"/></svg><span data-i18n="again"></span></button>
  </div>
</div>

  <div class="actions"><button id="clearHist" class="ghost"><svg class="ic"><use href="#i-trash"/></svg><span data-i18n="clear"></span></button></div>
</div>

<footer data-i18n="footer"></footer>
</div>
<div class="toast" id="toast"></div>

const T=()=>I18N[lang];
const fmt=(s,p)=>s.replace(/\{(\w+)\}/g,(m,k)=>p&&k in p?p[k]:m);
function t(k,p){return fmt(T()[k]||'',p);}
function fmtDate(d){try{return d.toLocaleString(T().locale);}catch(e){return d.toLocaleString();}}
function coloName(c){ if(!c||c==='—')return '—'; const n=T().colos[c]; return n?n+' ('+c+')':c; }
const IQ={BGW:1,EBL:1,BSR:1,NJF:1,ISU:1};
function applyLang(l){
  lang=l; const d=T().dir; document.documentElement.lang=l; document.documentElement.dir=d;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  if(typeof fillServerSelect==='function'&&typeof OOKLA!=='undefined')fillServerSelect();
  document.title=T().title+' — Sur3ati';
  if(typeof mode!=='undefined'&&mode==='game'){
    if(!running)$('phase').textContent=t('gReady');
    $('startBtn').querySelector('span').textContent=t('startGame');
    buildMap(); if(gameState){for(const id in gameState.res){const g=gameState.res[id];markRegion(id,rateOf(g.ping,g.loss),g.ping);} if(gameState.grade)buildGameReport(gameState,true);} renderGameTable();
  } else {
    if(!running){$('phase').textContent=state?t(state.stopped?'stopped':'done'):t('ready');}
    if(state){$('testTime').textContent=fmtDate(state.at);if(state.grade)buildReport(state,true);}
  }
  if(lastMeta){$('mColo').textContent=coloName(lastMeta.colo);}
  renderHistory();
  try{localStorage.setItem('sur3ati_lang',l);}catch(e){}
}

/* ================= theme ================= */
function applyTheme(th){ if(th)document.documentElement.dataset.theme=th; else delete document.documentElement.dataset.theme; try{th?localStorage.setItem('sur3ati_theme',th):localStorage.removeItem('sur3ati_theme');}catch(e){} refreshCss(); }
function currentIsDark(){ const d=document.documentElement.dataset.theme; if(d)return d==='dark'; return !matchMedia('(prefers-color-scheme: light)').matches; }
$('themeBtn').onclick=()=>applyTheme(currentIsDark()?'light':'dark');
let css={};
function refreshCss(){ const s=getComputedStyle(document.documentElement); css={muted:s.getPropertyValue('--muted').trim(),text:s.getPropertyValue('--text').trim(),accent:s.getPropertyValue('--accent').trim(),accent2:s.getPropertyValue('--accent2').trim(),track:s.getPropertyValue('--track').trim(),tick:s.getPropertyValue('--tick').trim(),particle:s.getPropertyValue('--particle').trim(),pline:s.getPropertyValue('--particleLine').trim(),glow:s.getPropertyValue('--glow').trim()}; }
refreshCss(); matchMedia('(prefers-color-scheme: light)').addEventListener('change',refreshCss);

/* ================= background ================= */
(function(){
  const c=$('bgc'),x=c.getContext('2d'); let W,H,pts=[];
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;pts=Array.from({length:Math.min(90,Math.floor(W*H/25000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25*devicePixelRatio,vy:(Math.random()-.5)*.25*devicePixelRatio,r:(Math.random()*1.4+.4)*devicePixelRatio}));}
  size(); addEventListener('resize',size);
  function tick(){
    x.clearRect(0,0,W,H);
    const boost=running?2.2:1;
    for(const p of pts){p.x+=p.vx*boost;p.y+=p.vy*boost;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;}
    x.strokeStyle='rgba('+css.pline+',.09)';x.lineWidth=devicePixelRatio;
    const D=140*devicePixelRatio;
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<D*D){x.globalAlpha=1-Math.sqrt(d)/D;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}
    x.globalAlpha=1;x.fillStyle='rgba('+css.particle+',.5)';
    for(const p of pts){x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();}
    if(!reduced)requestAnimationFrame(tick);
  }
  tick();
})();

/* ================= gauge ================= */
const gauge=$('gauge'), g=gauge.getContext('2d');
let gaugeVal=0, gaugeTarget=0, gaugeMax=100, gaugeMaxShown=100, glow=0, glowT=0, spin=0;
let flowDir=0, flowSpeed=0, flowPhase='idle', hueMix=0, hueTarget=0; // hueMix 0 = cyan (download), 1 = violet (upload)
const A0=Math.PI*0.75, SPAN=Math.PI*1.5;
const flow=Array.from({length:140},()=>({a:Math.random()*Math.PI*2,r:Math.random(),s:0.4+Math.random()*0.9,len:0.05+Math.random()*0.08}));
const sparks=[];
function setFlow(dir,phase){ flowDir=dir; flowPhase=phase; hueTarget=phase==='up'?1:0; }
function flowRate(f){ flowSpeed=Math.max(0.15,Math.min(1.6,f*1.4)); }
function mixColor(a,b,t){ const pa=parseColor(a),pb=parseColor(b); if(!pa||!pb)return a; return 'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')+')'; }
function parseColor(c){ c=c.trim(); if(c[0]==='#'){ if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; return [1,3,5].map(i=>parseInt(c.substr(i,2),16)); } const m=c.match(/rgba?\(([^)]+)\)/); return m?m[1].split(',').slice(0,3).map(Number):null; }
function drawGauge(){
  const W=gauge.width,H=gauge.height,cx=W/2,cy=H*0.52,R=W*0.36;
  const main=mixColor(css.accent,css.accent2,hueMix), alt=mixColor(css.accent2,css.accent,hueMix);
  g.clearRect(0,0,W,H);
  // data-flow particles (inward = download, outward = upload)
  if(flowDir!==0){
    const rIn=R-70, rOut=R+60;
    for(const p of flow){
      p.r+= (flowDir>0?-1:1)*0.012*p.s*flowSpeed; if(p.r<0){p.r=1;p.a=Math.random()*Math.PI*2;} if(p.r>1){p.r=0;p.a=Math.random()*Math.PI*2;}
      const rr=rIn+(rOut-rIn)*p.r, r2=rr+(flowDir>0?1:-1)*(rOut-rIn)*p.len*flowSpeed;
      const fade=Math.sin(p.r*Math.PI); g.globalAlpha=0.08+0.45*fade; g.strokeStyle=main; g.lineWidth=2.2;
      g.beginPath(); g.moveTo(cx+Math.cos(p.a)*rr,cy+Math.sin(p.a)*rr); g.lineTo(cx+Math.cos(p.a)*r2,cy+Math.sin(p.a)*r2); g.stroke();
    }
    g.globalAlpha=1;
  }
  g.lineWidth=2; g.strokeStyle=css.track; g.beginPath(); g.arc(cx,cy,R+44,0,7); g.stroke();
  if(running){ spin+=0.03; g.strokeStyle=main; g.globalAlpha=.6; g.lineWidth=3; g.lineCap='round'; g.beginPath(); g.arc(cx,cy,R+44,spin,spin+0.9); g.stroke(); g.beginPath(); g.arc(cx,cy,R+44,spin+Math.PI,spin+Math.PI+0.9); g.stroke(); g.globalAlpha=1; }
  for(let i=0;i<=60;i++){const tt=i/60,a=A0+SPAN*tt,major=i%15===0,len=major?18:8;
    g.strokeStyle=tt<=gaugeVal/gaugeMaxShown?main:css.tick;g.lineWidth=major?3:1.5;
    g.beginPath();g.moveTo(cx+Math.cos(a)*(R+18),cy+Math.sin(a)*(R+18));g.lineTo(cx+Math.cos(a)*(R+18+len),cy+Math.sin(a)*(R+18+len));g.stroke();}
  g.lineWidth=22; g.lineCap='round'; g.strokeStyle=css.track; g.beginPath(); g.arc(cx,cy,R,A0,A0+SPAN); g.stroke();
  const f=Math.min(gaugeVal/gaugeMaxShown,1);
  if(f>0.002){
    const grd=g.createConicGradient?g.createConicGradient(A0,cx,cy):null;
    if(grd){grd.addColorStop(0,alt);grd.addColorStop(.5,main);grd.addColorStop(.75,main);grd.addColorStop(1,alt);g.strokeStyle=grd;}else g.strokeStyle=main;
    g.shadowColor=css.glow; g.shadowBlur=24+glow*16;
    g.beginPath(); g.arc(cx,cy,R,A0,A0+SPAN*f); g.stroke();
    g.shadowBlur=0;
    // comet tail behind the head
    const a=A0+SPAN*f; const tail=Math.min(0.35,SPAN*f);
    for(let k=1;k<=5;k++){ g.globalAlpha=0.16*(6-k)/5; g.lineWidth=22+k*5; g.strokeStyle=main; g.beginPath(); g.arc(cx,cy,R,a-tail*k/5,a); g.stroke(); }
    g.globalAlpha=1;
    g.shadowColor='#fff'; g.shadowBlur=14; g.fillStyle='#fff'; g.beginPath(); g.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,7,0,7); g.fill(); g.shadowBlur=0;
    // sparks at the head while moving

  const start=performance.now(); let bytes=0, fails=0, reqs=0, active=0, maxWorkers=2; const samples=[], loaded=[]; let lastT=start,lastB=0, lastCheckSpeed=0;
  let chunk=5e6; const deadline=()=>performance.now()-start>=seconds*1000;
  async function worker(){
    active++;

      reqs++; const t0=performance.now(); let got=0;
      try{
        const r=await fetch(srv.down(chunk),{cache:'no-store',signal:aborter.signal});
        const reader=r.body.getReader();
        while(true){ const {done,value}=await reader.read(); if(done)break; bytes+=value.length; got+=value.length; if(deadline()){reader.cancel().catch(()=>{});break;} }
        const dt=(performance.now()-t0)/1000; if(!srv.tiny){ if(dt<0.5&&chunk<5e7)chunk=Math.min(5e7,chunk*2); else if(dt>3&&chunk>1e6)chunk=Math.max(1e6,chunk/2); }
      }catch(e){ if(!running||aborter.signal.aborted){active--;return;} fails++; await sleep(150); }
    }
    active--;

  const stopProbe=loadedProbe(loaded,450);
  const ticker=setInterval(()=>{
    const now=performance.now(); const dt=(now-lastT)/1000; if(dt<=0)return;
    const mbps=((bytes-lastB)*8/dt)/1e6; lastT=now; lastB=bytes; samples.push(mbps); const sm=smooth(mbps);
    setGauge(sm); setStat('sDown',sm); spark('spDown',samples,css.accent); flowRate(sm/Math.max(gaugeMax,1));

  },250);

    lastCheckSpeed=sp;

  const pool=[worker(),worker()];
  while(running && !deadline()){ await sleep(100); }
  await sleep(50); clearInterval(ticker); clearInterval(ramp); stopProbe();
  await Promise.race([Promise.all(pool),sleep(800)]);

}
function makeBlob(size){ const a=new Uint8Array(size); for(let i=0;i<size;i+=65536){ crypto.getRandomValues(a.subarray(i,Math.min(i+65536,size))); } return new Blob([a]); }
async function measureUpload(seconds){
  const start=performance.now(); let fails=0, reqs=0, maxWorkers=2, lastCheckSpeed=0; const samples=[], loaded=[]; const loadedPer=new Map(); let lastT=start,lastB=0; const xhrs=new Set();
  const total=()=>{let s=0;loadedPer.forEach(v=>s+=v);return s;};
  const blobs={s:makeBlob(1e6),m:makeBlob(4e6),l:makeBlob(8e6)}; let size='s';
  const deadline=()=>performance.now()-start>=seconds*1000;
  function one(){
    return new Promise(res=>{
      const x=new XMLHttpRequest(); const id=++reqs; const blob=blobs[size]; const t0=performance.now(); xhrs.add(x);
      x.open('POST',srv.up(),true);
      x.upload.onprogress=e=>{loadedPer.set(id,e.loaded);};
      x.onload=()=>{loadedPer.set(id,blob.size);xhrs.delete(x);const dt=(performance.now()-t0)/1000;if(dt<0.6&&size!=='l')size=size==='s'?'m':'l';else if(dt>3&&size!=='s')size=size==='l'?'m':'s';res(true);};

  async function worker(){ while(running && !deadline()){ await one(); } }
  const stopProbe=loadedProbe(loaded,450);
  const ticker=setInterval(()=>{
    const now=performance.now(); const dt=(now-lastT)/1000; if(dt<=0)return; const b=total();
    const mbps=((b-lastB)*8/dt)/1e6; lastT=now; lastB=b; samples.push(mbps); const sm=smooth(mbps);

    const el=(now-start)/1000; step(3,el/seconds); setPhase(t('uploading',{s:Math.max(0,Math.ceil(seconds-el))}));
  },250);

  clearInterval(ticker); clearInterval(ramp); stopProbe(); xhrs.forEach(x=>x.abort());

  const X=T().txt,L=[]; L.push(t('modeGame')+' — '+T().title); L.push(X.date+': '+fmtDate(gs.at)); L.push('');
  REGIONS.forEach(r=>{const g=gs.res[r.id]; if(!g)return; L.push(r.name[lang]+': '+(g.ping==null?T().rate.fail:Math.round(g.ping)+' ms | Jitter '+Math.round(g.jitter)+' ms | '+t('gLoss')+' '+g.loss+'%'+' | '+T().rate[rateOf(g.ping,g.loss)]));});
  L.push(''); L.push(X.grade+': '+gs.grade+' ('+gs.score+'/100)'); L.push('');
  gs.issues.forEach(i=>{const d=T().gIssues[i.key];L.push(X[i.lvl]+' '+fmt(d[0],i.p));L.push('  '+fmt(d[1],i.p));if(d[2])L.push('  '+X.fix+': '+fmt(d[2],i.p));});
  return L.join('\n');
}
function setMode(m){
  if(running)return; mode=m;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  const game=m==='game';
  $('gauge').hidden=game; $('mapWrap').hidden=!game; document.querySelector('.readout').hidden=game;
  document.querySelector('.summary').hidden=game; $('serverRow').hidden=game; $('planField').hidden=game;
  document.querySelector('.stats').hidden=game; $('speedHint').hidden=game; $('gamePanel').hidden=!game;
  $('st2').hidden=game; $('st3').hidden=game;
  $('startBtn').querySelector('span').textContent=game?t('startGame'):t('start');
  $('report').hidden=true; step(0);
  setPhase(game?t('gReady'):t('ready'));
  if(game){ buildMap(); renderGameTable(); }
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

/* ================= report ================= */
function buildReport(s,silent){
  const issues=[]; const add=(lvl,key,p)=>issues.push({lvl,key,p});
  const ping=s.ping.ping, jit=s.ping.jitter, dn=s.down.mbps, up=s.up.mbps;
  const bloat=s.bloat||0;
  let score=100;
  if(ping==null){add('bad','noServer');score-=60;}
  else if(ping>150){add('bad','pingBad',{v:Math.round(ping)});score-=25;}
  else if(ping>60){add('warn','pingWarn',{v:Math.round(ping)});score-=10;}
  else add('ok','pingOk',{v:Math.round(ping)});
  if(jit>40){add('bad','jitBad',{v:Math.round(jit)});score-=15;} else if(jit>15){add('warn','jitWarn',{v:Math.round(jit)});score-=5;}
  if(bloat>100){add('bad','bloat',{v:Math.round(bloat)});score-=15;} else if(bloat>30){add('warn','bloat',{v:Math.round(bloat)});score-=6;}
  if(dn<5){add('bad','dnBad',{v:dn.toFixed(1)});score-=30;} else if(dn<15){add('warn','dnWarn',{v:dn.toFixed(1)});score-=12;} else if(dn<40){add('ok','dnMid',{v:dn.toFixed(1)});score-=3;} else add('ok','dnOk',{v:dn.toFixed(1)});
  if(up<2){add('bad','upBad',{v:up.toFixed(1)});score-=15;} else if(up<5){add('warn','upWarn',{v:up.toFixed(1)});score-=6;} else if(dn>0&&dn/Math.max(up,0.1)>25){add('warn','asym',{v:Math.round(dn/up)});score-=3;}
  if(s.stab<60){add('bad','stabBad',{v:s.stab});score-=15;} else if(s.stab<80){add('warn','stabWarn',{v:s.stab});score-=6;}
  if(s.fails>0){add(s.fails>2?'bad':'warn','loss',{v:s.fails,t:s.total});score-=s.fails>2?15:5;}
  const colo=s.meta.colo;
  if(s.srvName){ add('ok','local',{v:s.srvName}); }
  else if(colo&&colo!=='—'&&!IQ[colo]){add('warn','abroad',{v:coloName(colo)});score-=5;} else if(IQ[colo]) add('ok','local',{v:coloName(colo)});
  if(s.plan){const r=dn/s.plan;const pct=Math.round(r*100);if(r<0.5){add('bad','planBad',{v:pct,p:s.plan});score-=15;}else if(r<0.8){add('warn','planWarn',{v:pct,p:s.plan});score-=5;}else add('ok','planOk',{v:pct,p:s.plan});}
  score=Math.max(0,Math.min(100,score));
  const grade=score>=90?'A':score>=75?'B':score>=60?'C':score>=40?'D':'F';
  const order={bad:0,warn:1,ok:2}; issues.sort((a,b)=>order[a.lvl]-order[b.lvl]);
  s.grade=grade; s.score=score; s.issues=issues;
  // render
  const gEl=$('grade'); gEl.textContent=grade; gEl.className='grade g-'+grade;
  $('verdictTitle').textContent=T().verdict[grade];
  const bads=issues.filter(i=>i.lvl==='bad').length, warns=issues.filter(i=>i.lvl==='warn').length;
  $('verdictText').textContent=t('score',{s:score})+' · '+(bads?t('crit',{n:bads}):t('noCrit'))+(warns?' · '+t('warns',{n:warns}):'');
  $('reportSub').textContent=fmtDate(s.at);
  const icon={bad:'i-x',warn:'i-warn',ok:'i-check'};
  $('issues').innerHTML=issues.map((i,k)=>{const d=T().issues[i.key];return '<div class="issue '+i.lvl+'" style="animation-delay:'+(silent?0:0.15+k*0.08)+'s"><div class="dot"><svg class="ic"><use href="#'+icon[i.lvl]+'"/></svg></div><div><h4>'+fmt(d[0],i.p)+'</h4><p>'+fmt(d[1],i.p)+'</p>'+(d[2]?'<div class="fix"><b>'+t('fixLabel')+'</b> '+fmt(d[2],i.p)+'</div>':'')+'</div></div>';}).join('');
  $('report').hidden=false;
  if(!silent){$('scoreFill').style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{$('scoreFill').style.width=score+'%';}));$('report').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});}
  else $('scoreFill').style.width=score+'%';
}
function reportText(s){
  const X=T().txt, L=[];
  L.push(X.head); L.push(X.date+': '+fmtDate(s.at));
  L.push('IP: '+s.meta.ip+' | '+t('isp')+': '+s.meta.isp+' | '+t('server')+': '+(s.srvName||coloName(s.meta.colo))); L.push('');
  L.push(t('download')+': '+s.down.mbps.toFixed(1)+' Mbps ('+X.peak+' '+s.down.peak.toFixed(1)+')');
  L.push(t('upload')+': '+s.up.mbps.toFixed(1)+' Mbps');
  L.push('Ping: '+(s.ping.ping==null?'—':Math.round(s.ping.ping))+' ms | Jitter: '+Math.round(s.ping.jitter)+' ms | '+X.loaded+': '+(s.pingLoaded.ping==null?'—':Math.round(s.pingLoaded.ping))+' ms');
  L.push(X.fails+': '+s.fails+'/'+s.total+' | '+X.stab+': '+s.stab+'%');
  if(s.plan) L.push(X.plan+': '+s.plan+' Mbps');
  L.push(''); L.push(X.grade+': '+s.grade+' ('+s.score+'/100)'); L.push('');
  s.issues.forEach(i=>{const d=T().issues[i.key];L.push(X[i.lvl]+' '+fmt(d[0],i.p));L.push('  '+fmt(d[1],i.p));if(d[2])L.push('  '+X.fix+': '+fmt(d[2],i.p));});
  return L.join('\n');
}

/* ================= history ================= */
const HKEY='sur3ati_history';
function loadHistory(){ try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return [];} }
function saveHistory(s){
  const h=loadHistory(); h.unshift({at:s.at.toISOString(),dn:s.down.mbps,up:s.up.mbps,ping:s.ping.ping,jit:s.ping.jitter,colo:s.meta.colo,srv:s.srvName||null,grade:s.grade});
  try{localStorage.setItem(HKEY,JSON.stringify(h.slice(0,15)));}catch(e){} renderHistory();
}
function renderHistory(){
  const h=loadHistory(); $('historyCard').hidden=!h.length;
  $('histBody').innerHTML=h.map(r=>'<tr><td>'+fmtDate(new Date(r.at))+'</td><td class="n">'+r.dn.toFixed(1)+'</td><td class="n">'+r.up.toFixed(1)+'</td><td class="n">'+(r.ping==null?'—':Math.round(r.ping))+'</td><td class="n">'+Math.round(r.jit)+'</td><td>'+(r.srv||coloName(r.colo))+'</td><td class="n">'+r.grade+'</td></tr>').join('');
}

/* ================= events / boot ================= */
const go=()=>mode==='game'?runGameTest():runTest();
$('startBtn').onclick=go;
$('againBtn').onclick=()=>{window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});go();};
$('stopBtn').onclick=()=>{running=false;aborter&&aborter.abort();setPhase(t('stopped'));};
$('copyBtn').onclick=async()=>{const tx=mode==='game'?gameReportText(gameState):reportText(state);try{await navigator.clipboard.writeText(tx);}catch(e){const ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}toast(t('copied'));};
$('printBtn').onclick=()=>window.print();
$('clearHist').onclick=()=>{try{localStorage.removeItem(HKEY);}catch(e){}renderHistory();};
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>applyLang(b.dataset.lang));
try{const p=localStorage.getItem('sur3ati_plan');if(p)$('planSpeed').value=p;}catch(e){}
$('planSpeed').onchange=e=>{try{localStorage.setItem('sur3ati_plan',e.target.value);}catch(err){}};
let savedLang='ar', savedTheme=null;
try{savedLang=localStorage.getItem('sur3ati_lang')||'ar';savedTheme=localStorage.getItem('sur3ati_theme');}catch(e){}
if(!I18N[savedLang])savedLang='ar';
if(savedTheme)applyTheme(savedTheme);
applyLang(savedLang);
fillServerSelect();
try{const s=localStorage.getItem('sur3ati_srv');if(s&&[...$('serverSel').options].some(x=>x.value===s))$('serverSel').value=s;const c=localStorage.getItem('sur3ati_custom');if(c)$('customUrl').value=c;$('customUrl').hidden=serverKey()!=='custom';}catch(e){}
loadMeta();

/* ================= splash: Iraq connects to the world ================= */
function buildSplash(){
  const G=(lon,lat)=>[200+(lon-43.7)*17, 172-(lat-33.3)*20];
  const poly=IRAQ.map(p=>G(...p).map(v=>v.toFixed(1)).join(',')).join(' ');
  const [bx,by]=G(44.4,33.3);
  const targets=[[30,20],[120,-10],[250,-14],[370,30],[412,120],[400,250],[330,346],[150,350],[-8,300],[-14,150]];
  let s='<svg viewBox="0 0 400 340" style="direction:ltr" xmlns="http://www.w3.org/2000/svg">';
  s+='<polygon class="sIraq" points="'+poly+'"/>';
  targets.forEach((tg,i)=>{
    const d=arcPath(bx,by,tg[0],tg[1]); const delay=(1.35+i*0.09).toFixed(2);
    s+='<path class="sArc" d="'+d+'" style="animation-delay:'+delay+'s"/>';
    s+='<circle class="sPkt" r="2.4"><animateMotion begin="'+delay+'s" dur="1s" fill="freeze" path="'+d+'"/><animate attributeName="opacity" begin="'+delay+'s" dur="1s" values="0;1;1;0" fill="freeze"/></circle>';
    s+='<circle class="sHalo" cx="'+tg[0]+'" cy="'+tg[1]+'" r="5" style="animation-delay:'+(+delay+0.95).toFixed(2)+'s"/>';
    s+='<circle class="sNode" cx="'+tg[0]+'" cy="'+tg[1]+'" r="3.5" style="animation-delay:'+(+delay+0.9).toFixed(2)+'s"/>';
  });
  s+='<circle class="sRing r1" cx="'+bx+'" cy="'+by+'" r="6"/><circle class="sRing r2" cx="'+bx+'" cy="'+by+'" r="6"/><circle class="sRing r3" cx="'+bx+'" cy="'+by+'" r="6"/>';
  s+='<circle class="sDot" cx="'+bx+'" cy="'+by+'" r="4.5" style="transform-box:fill-box;transform-origin:center"/>';
  s+='</svg>';
  $('splashMap').innerHTML=s;
  const skip=document.createElement('div'); skip.className='splashSkip'; skip.textContent='▸'; $('splash').appendChild(skip);
}
function endSplash(){ $('splash').classList.add('out'); }
if(reduced){ endSplash(); } else { buildSplash(); setTimeout(endSplash,3600); $('splash').addEventListener('click',endSplash); }
})();
