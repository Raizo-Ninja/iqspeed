name: Build iOS app

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # use the newest Xcode 16 on the runner: its bundled iOS simulator runtime is guaranteed to match
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate && plutil -p IQSpeed.xcodeproj/project.pbxproj | grep -m1 objectVersion

      - name: Build for iPhone simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project IQSpeed.xcodeproj -scheme IQSpeed -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-sim.log | grep -E "error:|error |warning: |BUILD|Compiling|Linking|actool" || true
          grep -q "BUILD SUCCEEDED" xcodebuild-sim.log || { echo "::group::errors"; grep -n -i -B2 -A6 "error" xcodebuild-sim.log | head -150; echo "::endgroup::"; exit 1; }

      - name: Smoke test on a simulator (launches the app and checks it loads iqspeed.net)
        run: |
          cd ios
          APP=$(find build -name "IQSpeed.app" -path "*iphonesimulator*" | head -1)
          [ -n "$APP" ] || { echo "No simulator app produced"; exit 1; }
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k in d for x in d[k] if x['isAvailable'] and 'iPhone' in x['name']))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" net.iqspeed.app
          sleep 14
          xcrun simctl io "$UDID" screenshot ios-simulator.png
          # the app must still be running (no crash on launch)
          xcrun simctl spawn "$UDID" launchctl list | grep -q net.iqspeed.app || { echo "App is not running after launch"; exit 1; }
          xcrun simctl shutdown "$UDID"

      - name: Package unsigned IPA (for signing with your own Apple account)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project IQSpeed.xcodeproj -scheme IQSpeed -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild-dev.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" xcodebuild-dev.log || { tail -80 xcodebuild-dev.log; exit 1; }
          APP=$(find build-device -name "IQSpeed.app" -path "*iphoneos*" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qr IQSpeed-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/ios-simulator.png
            ios/IQSpeed-unsigned.ipa
            ios/xcodebuild-*.log
        if: always()
